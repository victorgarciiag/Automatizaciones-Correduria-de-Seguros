server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;   # subida de PDFs de presupuestos

    # La API la sirve el backend: el navegador solo habla con este nginx (sin CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Rutas de Angular: cualquier URL desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
